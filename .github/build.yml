name: Build

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install
        env:
          CI: true

      - name: Check types
        run: npm run typecheck

      - name: Test pond
        run: npm run test:pond

      - name: Test build app
        run: npm run build
